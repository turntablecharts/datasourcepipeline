# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - turntabledata

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Zip artifact for deployment
        run: |
          zip release.zip ./* -r \
            -x "venv/*" \
            -x ".venv/*" \
            -x "antenv/*" \
            -x ".git/*" \
            -x ".github/*" \
            -x "__pycache__/*" \
            -x "*.pyc" \
            -x ".env" \
            -x "uploads/*"

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Unzip artifact for deployment
        run: unzip release.zip
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_753F8E8E116B4CC78DFB9A6A41FF0E4B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_9B7B712808BB438FBB6ADC2D2D29A147 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_27BF7C1ED1ED402F916F14740B3796CD }}

      - name: Configure Azure Startup Command
        run: |
          app_id="$(az webapp list --query "[?name=='turntabledata'].id | [0]" -o tsv)"
          test -n "$app_id" || { echo "Unable to find Azure Web App: turntabledata"; exit 1; }

          az webapp config set \
            --ids "$app_id" \
            --startup-file "python -m uvicorn src.main:app --host 0.0.0.0 --port 8000"

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'turntabledata'
          slot-name: 'Production'
          package: .
          startup-command: python -m uvicorn src.main:app --host 0.0.0.0 --port 8000

      - name: Restart Azure Web App
        run: |
          app_id="$(az webapp list --query "[?name=='turntabledata'].id | [0]" -o tsv)"
          test -n "$app_id" || { echo "Unable to find Azure Web App: turntabledata"; exit 1; }
          az webapp restart --ids "$app_id"
          
