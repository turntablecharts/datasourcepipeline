name: Build and deploy Python app to Azure Web App - data-service

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  AZURE_WEBAPP_NAME: 'turntable-data-service'
  AZURE_WEBAPP_SLOT: 'Production'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: test-secret
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: datasourcepipeline_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests

      - name: Zip artifact for deployment
        run: |
          zip release.zip ./* -r \
            -x "venv/*" \
            -x ".venv/*" \
            -x ".git/*" \
            -x ".github/*" \
            -x "__pycache__/*" \
            -x "*.pyc" \
            -x ".env" \
            -x "uploads/*"

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release.zip

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: Production
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Unzip artifact for deployment
        run: unzip release.zip

      - name: Validate Azure deployment configuration
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          test -n "$AZURE_CLIENT_ID" || { echo "Missing GitHub secret: AZURE_CLIENT_ID"; exit 1; }
          test -n "$AZURE_TENANT_ID" || { echo "Missing GitHub secret: AZURE_TENANT_ID"; exit 1; }
          test -n "$AZURE_SUBSCRIPTION_ID" || { echo "Missing GitHub secret: AZURE_SUBSCRIPTION_ID"; exit 1; }
          test -n "$AZURE_RESOURCE_GROUP" || { echo "Missing GitHub secret: AZURE_RESOURCE_GROUP"; exit 1; }
          test -n "$SECRET_KEY" || { echo "Missing GitHub secret: SECRET_KEY"; exit 1; }
          test -n "$DB_HOST" || { echo "Missing GitHub secret: DB_HOST"; exit 1; }
          test -n "$DB_PORT" || { echo "Missing GitHub secret: DB_PORT"; exit 1; }
          test -n "$DB_NAME" || { echo "Missing GitHub secret: DB_NAME"; exit 1; }
          test -n "$DB_USER" || { echo "Missing GitHub secret: DB_USER"; exit 1; }
          test -n "$DB_PASSWORD" || { echo "Missing GitHub secret: DB_PASSWORD"; exit 1; }

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure Azure App Settings
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          app_settings_args=(
            --name "${AZURE_WEBAPP_NAME}"
            --resource-group "${AZURE_RESOURCE_GROUP}"
            --settings
            "SECRET_KEY=${SECRET_KEY}"
            "DB_HOST=${DB_HOST}"
            "DB_PORT=${DB_PORT}"
            "DB_NAME=${DB_NAME}"
            "DB_USER=${DB_USER}"
            "DB_PASSWORD=${DB_PASSWORD}"
            "SCM_DO_BUILD_DURING_DEPLOYMENT=true"
            "ENABLE_ORYX_BUILD=true"
            "WEBSITES_PORT=8000"
          )

          if [ "${AZURE_WEBAPP_SLOT}" != "Production" ]; then
            app_settings_args+=(--slot "${AZURE_WEBAPP_SLOT}")
          fi

          az webapp config appsettings set "${app_settings_args[@]}"

      - name: Configure Azure Startup Command
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
        run: |
          startup_args=(
            --name "${AZURE_WEBAPP_NAME}"
            --resource-group "${AZURE_RESOURCE_GROUP}"
            --startup-file "python -m uvicorn src.main:app --host 0.0.0.0 --port 8000"
          )

          if [ "${AZURE_WEBAPP_SLOT}" != "Production" ]; then
            startup_args+=(--slot "${AZURE_WEBAPP_SLOT}")
          fi

          az webapp config set "${startup_args[@]}"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: ${{ env.AZURE_WEBAPP_SLOT }}
          package: .
          startup-command: python -m uvicorn src.main:app --host 0.0.0.0 --port 8000
