<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Turntable Data Service — Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: '#1D4ED8' }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen bg-gray-50 flex items-center justify-center">

  <div class="w-full max-w-md">

    <!-- Logo / Title -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 bg-brand rounded-2xl mb-4 shadow-lg">
        <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586
               a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-gray-900">Turntable Data Service</h1>
      <p class="text-gray-500 text-sm mt-1">Sign in to your account</p>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-8">

      <!-- Error banner -->
      <div id="error-banner"
           class="hidden mb-4 px-4 py-3 bg-red-50 border border-red-200 rounded-lg
                  text-red-700 text-sm flex items-center gap-2">
        <svg class="w-4 h-4 shrink-0" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd"
            d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0
               11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"
            clip-rule="evenodd"/>
        </svg>
        <span id="error-text"></span>
      </div>

      <!-- Form -->
      <div class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
          <input id="email" type="email" placeholder="you@company.com"
                 class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm
                        focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent
                        transition"/>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
          <input id="password" type="password" placeholder="••••••••"
                 class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm
                        focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent
                        transition"/>
        </div>
        <button id="login-btn"
                class="w-full bg-brand hover:bg-blue-700 text-white font-medium py-2.5
                       rounded-lg text-sm transition flex items-center justify-center gap-2">
          Sign in
        </button>
      </div>

    </div>

    <p class="text-center text-xs text-gray-400 mt-6">
      Don't have an account? Contact your administrator.
    </p>
  </div>

  <script src="/static/js/auth.js"></script>
  <script>
    // Redirect if already logged in
    if (getToken()) window.location.href = '/static/dashboard.html';

    const btn = document.getElementById('login-btn');
    const errorBanner = document.getElementById('error-banner');
    const errorText = document.getElementById('error-text');

    function showError(msg) {
      errorText.textContent = msg;
      errorBanner.classList.remove('hidden');
    }

    function setLoading(loading) {
      btn.disabled = loading;
      btn.innerHTML = loading
        ? `<svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
             <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
             <path class="opacity-75" fill="currentColor"
               d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
           </svg> Signing in...`
        : 'Sign in';
    }

    document.getElementById('password').addEventListener('keydown', e => {
      if (e.key === 'Enter') btn.click();
    });

    btn.addEventListener('click', async () => {
      errorBanner.classList.add('hidden');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showError('Please enter your email and password.');
        return;
      }

      setLoading(true);

      try {
        const res = await fetch(`${API}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({ username: email, password })
        });

        const data = await res.json();

        if (!res.ok) {
          showError(data.detail || 'Login failed. Please try again.');
          return;
        }

        saveToken(data.access_token);
        window.location.href = '/static/dashboard.html';

      } catch (err) {
        showError('Could not connect to the server. Please try again.');
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
